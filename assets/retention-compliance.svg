<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title"><title id="title">Compliance requires ongoing review across the subscription lifecycle</title><rect width="960" height="640" rx="24" fill="#f4f7fc"/><g font-family="Arial, sans-serif"><text x="48" y="55" font-size="17" fill="#2465df" font-weight="700">02  /  COMPLIANCE</text><text x="48" y="112" font-size="36" fill="#06122a" font-weight="700">Compliance continues after launch.</text><rect x="48" y="156" width="864" height="94" rx="16" fill="#06122a"/><text x="80" y="195" font-size="29" fill="#fff" font-weight="700">Review → Configure → Verify → Monitor</text><text x="80" y="229" font-size="21" fill="#d7deec" font-weight="500">Repeat as requirements and your experience change.</text><rect x="48" y="282" width="416" height="190" rx="16" fill="#fff"/><rect x="488" y="282" width="424" height="190" rx="16" fill="#fff"/><text x="76" y="324" font-size="27" fill="#2465df" font-weight="700">Instant cancel</text><text x="76" y="366" font-size="23" fill="#06122a" font-weight="500">Immediate cancellation</text><text x="76" y="400" font-size="23" fill="#06122a" font-weight="500">at the first step.</text><text x="76" y="444" font-size="18" fill="#626973" font-weight="500">Feedback and offers are optional.</text><text x="516" y="324" font-size="27" fill="#2465df" font-weight="700">One-click cancel</text><text x="516" y="366" font-size="23" fill="#06122a" font-weight="500">A persistent cancel link</text><text x="516" y="400" font-size="23" fill="#06122a" font-weight="500">at every step.</text><text x="516" y="444" font-size="18" fill="#626973" font-weight="500">A direct way to leave the flow.</text><text x="48" y="534" font-size="26" fill="#06122a" font-weight="700">Protect customer trust and your reputation.</text><text x="48" y="577" font-size="21" fill="#626973" font-weight="500">Your legal team reviews the complete configured experience.</text></g></svg>