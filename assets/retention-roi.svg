<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title"><title id="title">Compare retained value after the full cost of each approach</title><rect width="960" height="640" rx="24" fill="#f4f7fc"/><g font-family="Arial, sans-serif"><text x="48" y="55" font-size="17" fill="#2465df" font-weight="700">01  /  ROI</text><text x="48" y="112" font-size="36" fill="#06122a" font-weight="700">What is left after the full cost?</text><rect x="48" y="154" width="864" height="96" rx="16" fill="#06122a"/><text x="80" y="196" font-size="26" fill="#fff" font-weight="700">Incremental retained value</text><text x="80" y="228" font-size="20" fill="#d7deec" font-weight="500">Revenue retained because of your retention program</text><text x="48" y="302" font-size="23" fill="#06122a" font-weight="500">Evaluate both approaches on the same basis</text><rect x="48" y="330" width="416" height="190" rx="16" fill="#fff"/><rect x="488" y="330" width="424" height="190" rx="16" fill="#fff"/><text x="76" y="370" font-size="25" fill="#2465df" font-weight="700">Dedicated platform</text><text x="76" y="413" font-size="22" fill="#06122a" font-weight="500">Platform fee</text><text x="76" y="451" font-size="22" fill="#06122a" font-weight="500">Incentive costs</text><text x="76" y="489" font-size="22" fill="#06122a" font-weight="500">Team operating time</text><text x="516" y="370" font-size="25" fill="#2465df" font-weight="700">Custom flow</text><text x="516" y="413" font-size="22" fill="#06122a" font-weight="500">Build + maintenance</text><text x="516" y="451" font-size="22" fill="#06122a" font-weight="500">Incentive costs</text><text x="516" y="489" font-size="22" fill="#06122a" font-weight="500">Monitoring + team time</text><text x="48" y="578" font-size="26" fill="#06122a" font-weight="700">Compare the return, not just the software bill.</text></g></svg>