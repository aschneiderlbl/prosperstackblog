<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title"><title id="title">Protect renewing customers with reliable subscription changes</title><rect width="960" height="640" rx="24" fill="#f4f7fc"/><g font-family="Arial, sans-serif"><text x="48" y="55" font-size="17" fill="#2465df" font-weight="700">03  /  RENEWING CUSTOMERS</text><text x="48" y="112" font-size="36" fill="#06122a" font-weight="700">Protect the relationship you earned.</text><rect x="48" y="154" width="864" height="86" rx="16" fill="#06122a"/><text x="80" y="207" font-size="31" fill="#fff" font-weight="700">Acquired → Onboarded → Renewing</text><text x="48" y="292" font-size="25" fill="#06122a" font-weight="700">When a customer needs a change</text><rect x="48" y="320" width="280" height="168" rx="16" fill="#fff"/><text x="68" y="361" font-size="24" fill="#2465df" font-weight="700">Pause</text><text x="68" y="410" font-size="21" fill="#06122a" font-weight="500">Confirm the pause</text><text x="68" y="443" font-size="21" fill="#06122a" font-weight="500">and restart date.</text><rect x="340" y="320" width="280" height="168" rx="16" fill="#fff"/><text x="360" y="361" font-size="24" fill="#2465df" font-weight="700">Change plan</text><text x="360" y="410" font-size="21" fill="#06122a" font-weight="500">Apply the intended</text><text x="360" y="443" font-size="21" fill="#06122a" font-weight="500">plan and pricing.</text><rect x="632" y="320" width="280" height="168" rx="16" fill="#fff"/><text x="652" y="361" font-size="24" fill="#2465df" font-weight="700">Accept an offer</text><text x="652" y="410" font-size="21" fill="#06122a" font-weight="500">Apply the incentive</text><text x="652" y="443" font-size="21" fill="#06122a" font-weight="500">accurately.</text><text x="48" y="544" font-size="27" fill="#06122a" font-weight="700">Accurate billing. Clear confirmation.</text><text x="48" y="584" font-size="21" fill="#626973" font-weight="500">Keep willing subscribers. Honor customers who choose to cancel.</text></g></svg>